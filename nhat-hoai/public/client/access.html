<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#180208"><title>Mở khóa thiệp | LCLN</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;color:#fff3df;background:radial-gradient(ellipse at 50% 15%,#65151c 0,#2a080e 42%,#100207 100%);font-family:'Be Vietnam Pro',sans-serif}.card{width:min(100%,420px);padding:34px 26px;border:1px solid #d9b66d66;border-radius:24px;background:#260910cc;box-shadow:0 24px 80px #0008;text-align:center}.seal{width:62px;height:62px;margin:0 auto 18px;border:1px solid #d8b66c;border-radius:50%;display:grid;place-items:center;color:#e9cc87;font-size:27px}.eyebrow{font-size:10px;letter-spacing:.28em;color:#d9b66d}.card h1{font:500 30px 'Playfair Display',serif;margin:12px 0}.card p{font-size:13px;line-height:1.7;color:#d9c6b4}.card form{display:grid;gap:12px;margin-top:24px}input{width:100%;height:50px;border:1px solid #b98d64;border-radius:12px;background:#12050b;color:white;padding:0 15px;font:inherit;outline:none}input:focus{border-color:#f0d28e;box-shadow:0 0 0 3px #d9b66d22}button{height:50px;border:0;border-radius:12px;background:linear-gradient(135deg,#e8c77c,#a86b36);color:#2b090d;font:700 13px 'Be Vietnam Pro';cursor:pointer}#msg{min-height:22px;margin:12px 0 0;color:#ffd0bc;font-size:12px}.back{display:inline-block;margin-top:15px;color:#d9b66d;text-decoration:none;font-size:12px}</style></head><body><main class="card"><div class="seal">♥</div><div class="eyebrow">LCLN · WEDDING ARCHIVE</div><h1>Thiệp cưới riêng tư</h1><p>Vui lòng nhập mật khẩu để tiếp tục xem thiệp và lưu giữ những kỷ niệm.</p><form id="form"><input id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu truy cập" required maxlength="128"><button id="submit">Mở thiệp</button></form><p id="msg" role="status"></p><a class="back" href="/">Quay lại trang đầu</a></main><script>(()=>{const q=new URLSearchParams(location.search),next=q.get('next')||'/index-nam',form=document.getElementById('form'),input=document.getElementById('password'),msg=document.getElementById('msg'),btn=document.getElementById('submit');const safe=/^\/(index-nam|index-gai|nha-trai|nha-gai|album)(\?.*)?$/.test(next)?next:'/index-nam';fetch('/api/access',{cache:'no-store'}).then(r=>r.json()).then(s=>{if(!s.required||s.authorized)location.replace(safe);if(s.unconfigured)msg.textContent='Chế độ khóa chưa được cấu hình hoàn chỉnh. Vui lòng liên hệ quản trị viên.'}).catch(()=>msg.textContent='Không thể kiểm tra quyền truy cập.');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Đang xác thực…';msg.textContent='';try{const r=await fetch('/api/access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Không thể đăng nhập.');location.replace(safe)}catch(err){msg.textContent=err.message;input.select()}finally{btn.disabled=false;btn.textContent='Mở thiệp'}})})();</script></body></html>
